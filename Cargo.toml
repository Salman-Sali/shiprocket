[package]
name = "shiprocket"
description = "Async client for the Shiprocket shipping API"
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Salman-Sali"]
repository = "https://github.com/Salman-Sali/shiprocket"
readme = "README.md"
keywords = ["shiprocket", "shipping", "logistics", "courier", "india"]
categories = ["api-bindings", "web-programming::http-client"]
exclude = ["bruno/"]

[dependencies]
bon = "3"
reqwest = { version = "0.13", features = ["json", "query", "multipart", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["sync"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"
